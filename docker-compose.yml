services:
  inteligencia-operacional:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-true}
    ports:
      - "8080:80"
    restart: unless-stopped
